</style></head><body><main><div class="toolbar"><span id="brand">哈基米全责</span><label><span id="language-label">语言</span> <select id="language" aria-label="Language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label></div><div id="draft" class="notice" role="note"></div><div id="fallback" class="notice" role="status" hidden></div><article id="content"></article><nav aria-label="Related privacy rules"><p>相关官方规则 / Official rules</p><p><a href="https://sud.tech/cn/sdkprivacy" target="_blank" rel="noopener noreferrer">SUD-GI SDK 隐私协议</a> · <a href="https://mail.qq.com/" target="_blank" rel="noopener noreferrer">QQ 邮箱 / QQ Mail</a> · <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement" target="_blank" rel="noopener noreferrer">GitHub Privacy Statement</a></p></nav><noscript>请启用 JavaScript 以查看隐私指引。Please enable JavaScript to view this privacy guide.</noscript></main>
<script id="privacy-app">
'use strict';
const policies = {"zh-CN":"哈基米全责隐私保护指引\n\n开发者及个人信息处理者：刘浩（个人开发者）\n隐私保护联系邮箱：504064868@qq.com\n更新日期：2026年10月30日\n生效日期：2026年10月30日\n\n本指引说明《哈基米全责》（以下简称“本游戏”）的开发者（以下简称“我们”）如何处理您的信息，以及您如何行使相关权利。本指引适用于本游戏在 OpenPaaS 平台提供的服务。平台自身独立提供的服务还适用其相应隐私规则。\n\n一、开发者处理的信息\n\n我们仅在实现游戏功能所必需的范围内处理信息。\n\n1. 游戏进度与设置\n为了保存和恢复游戏进度，本游戏在本机保存关卡、游戏内资源、养成进度、奖励领取记录、相关游戏时间记录以及语言、音乐、音效等设置。这些记录用于继续游戏、结算游戏内收益及保持存档一致性。本游戏当前没有开发者自建的云存档服务，不提供跨设备存档同步，也不将本机存档主动上传到开发者服务器。\n\n2. 账号与身份信息\n本游戏当前业务代码不主动收集您的昵称、头像、性别、地区、手机号码或身份证号码，也未接入开发者自建的账号注册或登录服务。平台自身的账号、实名认证或其他信息处理活动，应根据平台实际服务和相应隐私规则另行说明；本条不代表平台不处理个人信息。\n\n3. 您主动联系时提供的信息\n当您通过本指引所列邮箱反馈问题或行使权利时，我们会处理您主动提供的联系方式、问题描述及您选择提交的相关材料，仅用于核实和处理该请求。请勿提供与问题无关的身份证件、账号密码或其他敏感信息。\n\n二、第三方插件及 SDK 信息\n\n1. OpenPaaS 运行环境\n本游戏通过宿主提供的 sud 接口运行，使用其设备本地文件读写和前后台通知能力。运行环境由宿主应用提供，游戏未自行打包登录、统计或广告源 SDK。\n\nOpenPaaS 官方宿主接入采用 SUDGI。其《SUD-GI SDK 隐私协议》披露的提供方为忽然科技（上海）有限公司，处理范围包括设备品牌、型号、生成的 Device ID、系统版本、CPU、内存使用、电量、屏幕分辨率、网络接入方式和类型，用于设备识别、兼容适配及故障排查，采用加密传输；游戏用户 ID 为可选项。本游戏业务代码未主动向该接口提交用户 ID。各分发宿主的实际 SDK 版本、配置及其他组件应结合该宿主公示的清单查阅，以上不是对所有宿主实装组件的统一认定。\n官方隐私政策：https://sud.tech/cn/sdkprivacy\nSUD 信息权利联系：help@sud.tech，0755-86563040。\n\n2. 激励视频广告\n本游戏已接入 OpenPaaS 激励视频接口，并已配置平台创建的激励视频广告位。广告是否实际可用，还取决于后台启用状态、宿主支持和广告填充；创建广告位不代表广告一定能播放。广告由实际宿主及其接入的广告服务提供，本游戏未自行打包具体广告源 SDK。\n\n广告仅由您主动选择触发；完整满足观看条件后才发放对应游戏奖励，取消、失败或超时不视为观看完成。正式提供广告服务前，我们会根据实际宿主和广告源补充提供方、数据类型、用途、处理方式及隐私政策，并完成适用的告知和同意流程。广告不可用时不能提供依赖广告完成的奖励；不影响不依赖广告的普通游戏操作。\n\n三、信息的存储与保护\n\n1. 本机存档\nOpenPaaS 版本通过 sud.getFileSystemManager 在 sud.env.USER_DATA_PATH 对应的设备本地文件区读写存档，并使用 localStorage 保存恢复日志和语言偏好。记录保留到被后续进度覆盖、您清除对应游戏数据或宿主清理本地数据为止。清理时应同时清除该游戏的本地文件区和本地存储，避免恢复日志保留旧进度。卸载或更换设备可能导致存档丢失，开发者没有云端副本可供恢复。\n\n2. 邮件反馈\n您发送到 504064868@qq.com 的反馈会进入开发者的 QQ 邮箱。我们仅为处理相应咨询、投诉或权利请求而使用您提交的内容；事项处理完毕且不再需要保留时，删除或匿名化相关个人信息。依法必须留存的，仅在相应法定期限和必要范围内保存。邮箱服务自身的存储、备份及安全处理受其服务规则约束，您可在 QQ 邮箱官方服务的隐私入口查阅；本游戏没有独立的在线反馈表单或客服数据库。\n\n3. 运行环境和协议网页\nSUD-GI 官方政策说明，其在中国境内收集的信息存于中国境内，按服务必要或法定期限保留；这不代表邮件、所有分发宿主或其他服务均存储在同一地区。\n\n本隐私协议网页由 GitHub Pages 提供。GitHub 会为安全目的记录访问者的 IP 地址；其服务可在美国等多个地区处理信息，保存期限和权利渠道见 GitHub 隐私声明。本网页没有自行添加统计、广告跟踪、第三方字体或用户输入表单；语言参数仅用于选择显示文本，不包含游戏存档。\nGitHub 隐私声明：https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\n\n我们将采取与所处理信息风险相适应的安全措施，防止信息被未经授权访问、泄露、篡改或丢失。发生个人信息安全事件时，我们将依法采取补救措施，并履行适用的通知、报告义务。\n\n四、信息的使用规则\n\n我们仅在本指引告知的目的和范围内使用信息。如果处理目的、处理方式或信息种类发生变化，我们会在相关处理发生前更新告知；依法需要取得同意的，将事先取得相应同意。对于以同意为基础的处理，您有权撤回同意，撤回不影响此前基于同意进行的处理的效力。\n\n五、信息对外提供\n\n我们不会出售您的个人信息。向其他个人信息处理者提供或公开披露个人信息时，我们将依法履行相应告知义务，并在依法需要时取得您的单独同意。委托第三方处理信息时，我们将依法约定处理范围、安全要求等事项并进行监督。法律法规规定的其他合法处理情形，依照相应规定执行。\n\n六、您的权利和联系方式\n\n您可以通过本指引所列邮箱联系我们，依法提出查阅、复制、更正、补充、删除个人信息、限制或拒绝相关处理、撤回同意以及要求解释信息处理规则等请求。我们将在必要范围内核实请求人的身份，并依法及时处理；无法满足请求的，将说明理由。\n\n您可通过设备、浏览器或宿主平台实际提供的数据管理功能清除本机游戏记录。此操作会影响继续游戏，且不能代替删除平台独立保存的信息。平台账号注销、平台授权撤回及平台数据删除，应通过平台提供的相应渠道办理；需要我们协助的，可通过上述邮箱联系。\n\n七、未成年人个人信息保护\n\n未成年人应在父母或其他监护人指导下阅读本指引和实际宿主的隐私规则。SUD-GI 官方规则要求未满十八周岁的用户使用相关功能前取得监护人书面同意。当前游戏没有独立的年龄识别、实名认证或监护人同意验证界面，本指引不表示这些功能已经实现。\n\n不满十四周岁儿童个人信息的专门规则如下：我们不主动要求儿童提交姓名、身份证、手机号、头像或其他身份资料，不将邮件反馈用于广告画像或营销。儿童需要通过邮箱反馈时，应由监护人代为联系，尽量只提供问题描述，不发送儿童证件、家庭住址、学校等无关信息。\n\n监护人可通过 504064868@qq.com 提出查询、更正、删除或停止处理儿童个人信息的请求。我们只在办理请求所必要的范围核实监护关系和请求内容；如发现收到未经适当监护人同意提供的儿童个人信息，将停止非必要使用，并依法删除或在确需保留时仅作受限存储和安全保护。因履行法律义务确需处理的，按相应法定要求办理。\n\n平台账号、宿主 SDK 独立处理的信息及相关授权，应同时通过实际宿主和 SUD 的权利渠道办理；我们将对属于开发者处理范围的事项提供协助。涉及新的儿童个人信息收集功能时，须先完成相应监护人同意和保护措施，再开放该功能。\n\n八、指引更新\n\n我们会根据实际功能和信息处理活动更新本指引，并通过游戏或平台实际提供的入口展示。涉及重大变化时，我们将依法以显著方式告知。您可通过本指引所列邮箱提出投诉、建议或未成年人个人信息保护相关问题。\n\n隐私保护联系邮箱：504064868@qq.com","en":"Privacy Guide for 哈基米全责\n\nDeveloper and personal information handler: 刘浩 (Individual Developer)\nPrivacy contact email: 504064868@qq.com\nLast updated: October 30, 2026\nEffective date: October 30, 2026\n\nThis Guide explains how the developer of 哈基米全责 (the “Game,” “we,” “us,” or “our”) handles your information and how you can exercise your rights. It applies to the Game's services on the OpenPaaS platform. Services independently provided by the platform are also subject to the platform's applicable privacy rules.\n\n1. Information Handled by the Developer\n\nWe handle information only to the extent necessary to provide the Game's features.\n\nGame progress and settings\nTo save and restore your progress, the Game stores levels, in-game resources, progression, reward claim records, relevant gameplay timestamps, and language, music and sound settings on your device. These records support continued play, calculation of in-game earnings, and save consistency. The Game currently has no developer-operated cloud save service, does not synchronize saves across devices, and does not actively upload local saves to a developer server.\n\nAccount and identity information\nThe Game's current business code does not actively collect your nickname, avatar, gender, region, phone number, or national identity card number. It does not integrate a developer-operated account registration or login service. Any account services, identity verification, or other information handling independently performed by the platform must be described according to the platform's actual services and applicable privacy rules. This statement does not mean that the platform handles no personal information.\n\nInformation you provide when contacting us\nIf you use the email address in this Guide to report an issue or exercise your rights, we handle the contact details, issue description, and relevant materials you choose to provide solely to verify and address your request. Please do not send identity documents, account passwords, or other sensitive information unrelated to the request.\n\n2. Third-Party Plugins and SDKs\n\nOpenPaaS runtime\nThe Game runs through the host-provided sud interfaces and uses on-device file access and foreground/background notifications. The host application supplies the runtime; the Game does not independently package login, analytics or advertising-source SDKs.\n\nOfficial OpenPaaS host integration uses SUDGI. The SUD-GI SDK Privacy Policy names 忽然科技（上海）有限公司 as its provider. It describes device brand, model, generated Device ID, system version, CPU, memory use, battery level, resolution and network access type for identification, compatibility and troubleshooting, with encrypted transmission. A game user ID is optional; the Game's business code does not actively submit one to this interface. Consult each host's disclosures for its actual SDK versions, configuration and other components; this is not a universal inventory of all distribution hosts.\nOfficial privacy policy: https://sud.tech/cn/sdkprivacy\nSUD rights contact: help@sud.tech; +86 755-86563040.\n\nRewarded video advertising\nThe Game integrates the OpenPaaS rewarded video interface and has configured a rewarded video placement created on the platform. Actual availability depends on console activation, host support and advertising fill; creating a placement does not guarantee playback. Advertising is supplied by the actual host and its advertising services. The Game does not independently package a specific advertising-source SDK.\n\nAdvertising is triggered only when you choose it. The corresponding in-game reward is granted only when the viewing condition is fully met; cancellation, failure or timeout does not count as completion. Before offering the advertising service in production, we will disclose the actual host and advertising providers, information types, purposes, handling methods and privacy policies, and complete applicable notice and consent procedures. Rewards requiring completed advertising are unavailable when advertising cannot be provided; ordinary gameplay that does not depend on advertising remains available.\n\n3. Information Storage and Protection\n\nLocal saves\nThe OpenPaaS version reads and writes saves through sud.getFileSystemManager in the on-device file area identified by sud.env.USER_DATA_PATH. It uses localStorage for recovery journals and language preferences. Records remain until overwritten by later progress, cleared by you, or removed through the host's local data management. Clear both the Game's local file area and local storage to avoid retaining old progress in recovery journals. Uninstalling or changing devices may cause loss of progress; the developer has no cloud copy for recovery.\n\nEmail feedback\nFeedback sent to 504064868@qq.com is delivered to the developer's QQ Mail mailbox. We use the submitted content only to address the relevant inquiry, complaint or rights request. When the matter is resolved and retention is no longer necessary, we delete or anonymize the associated personal information. Where retention is legally required, we retain only what is necessary for the applicable legal period. The email service's own storage, backups and security processing are governed by its service rules, accessible through QQ Mail's official privacy entry. The Game has no independent online feedback form or customer support database.\n\nRuntime and privacy webpage\nThe SUD-GI policy states that information collected within China is stored within China and retained for necessary service or legal periods. This does not mean that email, every distribution host or other services store information in the same region.\n\nThis privacy webpage is hosted on GitHub Pages. GitHub logs visitors' IP addresses for security; its services may process information in multiple regions, including the United States. Retention and rights channels are described in GitHub's Privacy Statement. This webpage adds no analytics, advertising trackers, third-party fonts or user input forms. The language parameter selects displayed text and contains no game save data.\nGitHub Privacy Statement: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\n\nWe will implement security measures appropriate to the risks associated with the information handled to prevent unauthorized access, disclosure, alteration, or loss. If a personal information security incident occurs, we will take remedial measures and fulfill applicable notification and reporting obligations.\n\n4. Rules for Using Information\n\nWe use information only for the purposes and within the scope disclosed in this Guide. If the purposes, handling methods, or information types change, we will update the notice before the relevant handling occurs and obtain the applicable consent in advance where required by law. You may withdraw consent for consent-based handling. Withdrawal does not affect the validity of handling previously carried out on the basis of that consent.\n\n5. Providing Information to Others\n\nWe do not sell your personal information. When providing personal information to another personal information handler or disclosing it publicly, we will fulfill applicable notice obligations and obtain your separate consent where required by law. When entrusting a third party to handle information, we will establish the scope of handling, security requirements, and other required terms and supervise the handling in accordance with law. Other lawful grounds for handling information will be applied as provided by applicable law.\n\n6. Your Rights and How to Contact Us\n\nYou may contact us using the email address in this Guide to request access, copies, correction, supplementation, or deletion of your personal information; restrict or refuse relevant handling; withdraw consent; or request an explanation of our information handling rules, as provided by applicable law. We will verify the requester's identity only to the extent necessary and address requests promptly in accordance with law. If we cannot fulfill a request, we will explain why.\n\nYou may clear local gameplay records using the data management functions actually provided by your device, browser, or host platform. Doing so affects continued play and does not delete information independently retained by the platform. Platform account deletion, withdrawal of platform permissions, and deletion of platform data should be requested through the platform's applicable channels. You may contact us at the email address above if you need our assistance.\n\n7. Protection of Minors' Personal Information\n\nMinors should read this Guide and the actual host's privacy rules with a parent or other guardian. SUD-GI's official rules require written parental or guardian consent before users under 18 use relevant features. The current Game has no independent age identification, real-name verification or guardian-consent verification interface; this Guide does not represent those features as implemented.\n\nSpecial rules for personal information of children under 14 are as follows. We do not actively ask children for names, identity documents, phone numbers, avatars or other identity details, and do not use email feedback for advertising profiles or marketing. A guardian should contact us on a child's behalf, preferably providing only an issue description and avoiding unrelated child identity documents, home addresses or school information.\n\nGuardians may email 504064868@qq.com to request access, correction, deletion or cessation of handling of a child's personal information. We verify the guardian relationship and request only to the extent necessary. If we discover children's information provided without appropriate guardian consent, we will stop unnecessary use and delete it as required by law, or restrict any necessary retention to storage and security protection. Handling required to fulfill legal obligations follows the applicable legal requirements.\n\nFor platform accounts, information independently handled by host SDKs and associated permissions, also use the actual host's and SUD's rights channels. We will assist with matters within the developer's responsibility. Any new feature collecting children's personal information requires the applicable guardian consent and protective measures before it is made available.\n\n8. Updates to This Guide\n\nWe will update this Guide to reflect actual features and information handling activities and make it available through the access points actually provided by the Game or platform. We will provide prominent notice of material changes as required by law. You may use the email address in this Guide for complaints, suggestions, or questions about the protection of minors' personal information.\n\nPrivacy contact email: 504064868@qq.com"};
const raw = (new URLSearchParams(location.search).get('language') || '').trim();
const normalized = raw.toLowerCase().replace(/_/g, '-');
const chinese = /^(zh(?:-.*)?|中文|简体中文|中文简体|chinese)$/.test(normalized);
const english = /^(en(?:-.*)?|英文|英语|english)$/.test(normalized);
const lang = !raw || chinese ? 'zh-CN' : 'en';
document.documentElement.lang = lang;
document.title = lang === 'en' ? 'Privacy Guide | 哈基米全责' : '哈基米全责隐私保护指引';
document.getElementById('language').value = lang;
document.getElementById('language-label').textContent = lang === 'en' ? 'Language' : '语言';
document.getElementById('draft').textContent = lang === 'en' ? 'Current version: a rewarded video placement is configured. Availability depends on console activation, host support and advertising fill. Provider disclosures and applicable consent procedures must be completed before production advertising.' : '当前版本说明：已配置激励视频广告位，实际可用性取决于后台启用、宿主支持和广告填充；正式提供广告服务前需完成实际广告源披露及适用授权。';
document.getElementById('fallback').hidden = !raw || chinese || english;
document.getElementById('fallback').textContent = 'This language is not available. The English version is displayed. 所选语言暂无译文，现显示英文版。';
const paragraphs = policies[lang].split(/\n\s*\n/);
document.getElementById('content').replaceChildren(...paragraphs.map((text, index) => {
  const heading = lang === 'en' ? /^[1-8]\. /.test(text) : /^[一二三四五六七八]、/.test(text);
  const node = document.createElement(index === 0 ? 'h1' : heading ? 'h2' : 'p');
  node.textContent = text;
  return node;
}));
document.getElementById('language').addEventListener('change', function () {
  const url = new URL(location.href);
  url.searchParams.set('language', this.value);
  location.assign(url.href);
});
</script></body></html>
