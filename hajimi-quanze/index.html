<script id="privacy-app">
'use strict';
const policies = {"zh-CN":"哈基米全责隐私保护指引\n\n开发者及个人信息处理者：刘浩（个人开发者）\n隐私保护联系邮箱：504064868@qq.com\n更新日期：2026年10月30日\n生效日期：2026年10月30日\n\n本指引说明《哈基米全责》（以下简称“本游戏”）的开发者（以下简称“我们”）如何处理您的信息，以及您如何行使相关权利。本指引适用于本游戏在 OpenPaaS 平台提供的服务。平台自身独立提供的服务还适用其相应隐私规则。\n\n一、开发者处理的信息\n\n我们仅在实现游戏功能所必需的范围内处理信息。\n\n1. 游戏进度与设置\n为了保存和恢复游戏进度，本游戏在本机保存关卡、游戏内资源、养成进度、奖励领取记录、相关游戏时间记录以及音乐、音效等设置。这些记录用于继续游戏、结算游戏内收益及保持存档一致性。本游戏当前没有开发者自建的云存档服务，不提供跨设备存档同步。\n\n2. 账号与身份信息\n本游戏当前业务代码不主动收集您的昵称、头像、性别、地区、手机号码或身份证号码，也未接入开发者自建的账号注册或登录服务。平台自身的账号、实名认证或其他信息处理活动，应根据平台实际服务和相应隐私规则另行说明；本条不代表平台不处理个人信息。\n\n3. 您主动联系时提供的信息\n当您通过本指引所列邮箱反馈问题或行使权利时，我们会处理您主动提供的联系方式、问题描述及您选择提交的相关材料，仅用于核实和处理该请求。请勿提供与问题无关的身份证件、账号密码或其他敏感信息。\n\n二、第三方插件及 SDK 信息\n\n本游戏 OpenPaaS 版本使用的第三方组件及相关信息如下：\n【待核实后填写：插件或 SDK 名称、提供方全称、具体功能、信息类型、处理目的、处理方式、隐私政策链接及权利行使渠道。没有接入的组件应删除，不得保留示例名称。】\n\n如果版本提供由您主动选择的激励视频广告，我们会在您选择该功能时调用实际接入的广告服务，并根据播放结果处理游戏内奖励。广告服务涉及的设备、网络、标识符或其他信息，须按实际服务逐项披露，不得据此推定本游戏或平台不收集这些信息。\n【待确认：OpenPaaS 版本是否提供激励广告；如提供，应补齐广告服务提供方及上述信息清单；如不提供，应删除本段。】\n\n三、信息的存储与保护\n\n本机游戏记录保存在您所使用设备的浏览器本地存储或平台提供的本机存储空间中，具体以发布版本实际接入的存储方式为准。清除对应游戏或站点数据、卸载宿主应用或更换设备，可能导致进度丢失；清除前请确认您愿意放弃相关进度。\n\n对于我们因处理反馈或权利请求而收到的信息，仅在完成相应处理所必需的最短期限内保留；法律法规另有保存要求的，从其规定。期限届满后，我们将依法删除或匿名化处理。\n\n【待填写：反馈资料实际存储地点和保存期限；如第三方服务处理或存储信息，还须补齐其适用的存储地点、保存期限及相关安排。】\n\n我们将采取与所处理信息风险相适应的安全措施，防止信息被未经授权访问、泄露、篡改或丢失。发生个人信息安全事件时，我们将依法采取补救措施，并履行适用的通知、报告义务。\n\n四、信息的使用规则\n\n我们仅在本指引告知的目的和范围内使用信息。如果处理目的、处理方式或信息种类发生变化，我们会在相关处理发生前更新告知；依法需要取得同意的，将事先取得相应同意。对于以同意为基础的处理，您有权撤回同意，撤回不影响此前基于同意进行的处理的效力。\n\n五、信息对外提供\n\n我们不会出售您的个人信息。向其他个人信息处理者提供或公开披露个人信息时，我们将依法履行相应告知义务，并在依法需要时取得您的单独同意。委托第三方处理信息时，我们将依法约定处理范围、安全要求等事项并进行监督。法律法规规定的其他合法处理情形，依照相应规定执行。\n\n六、您的权利和联系方式\n\n您可以通过本指引所列邮箱联系我们，依法提出查阅、复制、更正、补充、删除个人信息、限制或拒绝相关处理、撤回同意以及要求解释信息处理规则等请求。我们将在必要范围内核实请求人的身份，并依法及时处理；无法满足请求的，将说明理由。\n\n您可通过设备、浏览器或宿主平台实际提供的数据管理功能清除本机游戏记录。此操作会影响继续游戏，且不能代替删除平台独立保存的信息。平台账号注销、平台授权撤回及平台数据删除，应通过平台提供的相应渠道办理；需要我们协助的，可通过上述邮箱联系。\n\n七、未成年人个人信息保护\n\n未成年人应在父母或其他监护人指导下阅读本指引。涉及不满十四周岁未成年人个人信息的处理，我们将依法取得父母或其他监护人同意，并适用相应的专门保护规则。监护人如对相关信息处理有疑问，或要求更正、删除信息，可通过本指引所列邮箱联系。\n【待确认并补齐：发布版本适用的未成年人保护流程及儿童个人信息专门处理规则或其访问入口。】\n\n八、指引更新\n\n我们会根据实际功能和信息处理活动更新本指引，并通过游戏或平台实际提供的入口展示。涉及重大变化时，我们将依法以显著方式告知。您可通过本指引所列邮箱提出投诉、建议或未成年人个人信息保护相关问题。\n\n隐私保护联系邮箱：504064868@qq.com","en":"Privacy Guide for 哈基米全责\n\nDeveloper and personal information handler: 刘浩 (Individual Developer)\nPrivacy contact email: 504064868@qq.com\nLast updated: October 30, 2026\nEffective date: October 30, 2026\n\nThis Guide explains how the developer of 哈基米全责 (the “Game,” “we,” “us,” or “our”) handles your information and how you can exercise your rights. It applies to the Game's services on the OpenPaaS platform. Services independently provided by the platform are also subject to the platform's applicable privacy rules.\n\n1. Information Handled by the Developer\n\nWe handle information only to the extent necessary to provide the Game's features.\n\nGame progress and settings\nTo save and restore your progress, the Game stores levels, in-game resources, progression, reward claim records, relevant gameplay timestamps, and settings such as music and sound effects on your device. These records support continued play, calculation of in-game earnings, and save consistency. The Game currently has no developer-operated cloud save service and does not synchronize saves across devices.\n\nAccount and identity information\nThe Game's current business code does not actively collect your nickname, avatar, gender, region, phone number, or national identity card number. It does not integrate a developer-operated account registration or login service. Any account services, identity verification, or other information handling independently performed by the platform must be described according to the platform's actual services and applicable privacy rules. This statement does not mean that the platform handles no personal information.\n\nInformation you provide when contacting us\nIf you use the email address in this Guide to report an issue or exercise your rights, we handle the contact details, issue description, and relevant materials you choose to provide solely to verify and address your request. Please do not send identity documents, account passwords, or other sensitive information unrelated to the request.\n\n2. Third-Party Plugins and SDKs\n\nThe third-party components used by the OpenPaaS version of the Game and their relevant details are as follows:\n[VERIFY AND INSERT: plugin or SDK name, provider's full name, specific features, information types, purposes, handling methods, privacy policy link, and channels for exercising rights. Remove components that are not integrated; do not retain example names.]\n\nIf this version offers optional rewarded video advertising, we call the advertising service actually integrated when you select that feature and process in-game rewards based on the playback result. Any device information, network information, identifiers, or other information handled by that service must be disclosed specifically according to the actual service. This paragraph must not be interpreted as a claim that the Game or platform collects none of that information.\n[CONFIRM whether the OpenPaaS version offers rewarded advertising. If so, complete the advertising provider and the information list above. Otherwise, remove this paragraph.]\n\n3. Information Storage and Protection\n\nLocal gameplay records are stored in your device's browser local storage or in on-device storage provided by the platform, depending on the storage method actually integrated in the released version. Clearing the relevant game or website data, uninstalling the host application, or changing devices may cause loss of progress. Before clearing data, confirm that you are willing to give up the associated progress.\n\nWe retain information received when handling feedback or rights requests only for the shortest period necessary to complete that handling, unless a different retention period is required by law. When that period ends, we delete or anonymize the information in accordance with applicable law.\n\n[INSERT the actual storage location and retention period for feedback materials. Where third-party services handle or store information, also complete their applicable storage locations, retention periods, and related arrangements.]\n\nWe will implement security measures appropriate to the risks associated with the information handled to prevent unauthorized access, disclosure, alteration, or loss. If a personal information security incident occurs, we will take remedial measures and fulfill applicable notification and reporting obligations.\n\n4. Rules for Using Information\n\nWe use information only for the purposes and within the scope disclosed in this Guide. If the purposes, handling methods, or information types change, we will update the notice before the relevant handling occurs and obtain the applicable consent in advance where required by law. You may withdraw consent for consent-based handling. Withdrawal does not affect the validity of handling previously carried out on the basis of that consent.\n\n5. Providing Information to Others\n\nWe do not sell your personal information. When providing personal information to another personal information handler or disclosing it publicly, we will fulfill applicable notice obligations and obtain your separate consent where required by law. When entrusting a third party to handle information, we will establish the scope of handling, security requirements, and other required terms and supervise the handling in accordance with law. Other lawful grounds for handling information will be applied as provided by applicable law.\n\n6. Your Rights and How to Contact Us\n\nYou may contact us using the email address in this Guide to request access, copies, correction, supplementation, or deletion of your personal information; restrict or refuse relevant handling; withdraw consent; or request an explanation of our information handling rules, as provided by applicable law. We will verify the requester's identity only to the extent necessary and address requests promptly in accordance with law. If we cannot fulfill a request, we will explain why.\n\nYou may clear local gameplay records using the data management functions actually provided by your device, browser, or host platform. Doing so affects continued play and does not delete information independently retained by the platform. Platform account deletion, withdrawal of platform permissions, and deletion of platform data should be requested through the platform's applicable channels. You may contact us at the email address above if you need our assistance.\n\n7. Protection of Minors' Personal Information\n\nMinors should read this Guide with a parent or other guardian. Where we handle personal information of a child under 14, we will obtain consent from a parent or other guardian as required by law and apply the relevant special protection rules. Guardians may contact us using the email address in this Guide with questions about such handling or requests to correct or delete information.\n[CONFIRM AND COMPLETE the minors' protection procedures applicable to the released version and the special rules for handling children's personal information or the location where those rules can be accessed.]\n\n8. Updates to This Guide\n\nWe will update this Guide to reflect actual features and information handling activities and make it available through the access points actually provided by the Game or platform. We will provide prominent notice of material changes as required by law. You may use the email address in this Guide for complaints, suggestions, or questions about the protection of minors' personal information.\n\nPrivacy contact email: 504064868@qq.com"};
const raw = (new URLSearchParams(location.search).get('language') || '').trim();
const normalized = raw.toLowerCase().replace(/_/g, '-');
const chinese = /^(zh(?:-.*)?|中文|简体中文|中文简体|chinese)$/.test(normalized);
const english = /^(en(?:-.*)?|英文|英语|english)$/.test(normalized);
const lang = !raw || chinese ? 'zh-CN' : 'en';
document.documentElement.lang = lang;
document.title = lang === 'en' ? 'Privacy Guide | 哈基米全责' : '哈基米全责隐私保护指引';
document.getElementById('language').value = lang;
document.getElementById('language-label').textContent = lang === 'en' ? 'Language' : '语言';
document.getElementById('draft').textContent = lang === 'en' ? 'Draft for review. OpenPaaS components, advertising, storage and minors’ protection procedures remain to be confirmed. This is not a finalized privacy notice.' : '待确认稿：OpenPaaS 组件、广告、存储及未成年人保护流程仍需核实，当前不是最终确认版本。';
document.getElementById('fallback').hidden = !raw || chinese || english;
document.getElementById('fallback').textContent = 'This language is not available. The English version is displayed. 所选语言暂无译文，现显示英文版。';
const paragraphs = policies[lang].split(/\n\s*\n/);
document.getElementById('content').replaceChildren(...paragraphs.map((text, index) => {
  const heading = lang === 'en' ? /^[1-8]\. /.test(text) : /^[一二三四五六七八]、/.test(text);
  const node = document.createElement(index === 0 ? 'h1' : heading ? 'h2' : 'p');
  node.textContent = text;
  return node;
}));
document.getElementById('language').addEventListener('change', function () {
  const url = new URL(location.href);
  url.searchParams.set('language', this.value);
  location.assign(url.href);
});
</script></body></html>
